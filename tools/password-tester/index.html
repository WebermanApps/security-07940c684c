<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FAF6EE">
<title>Password Tester</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#FAF6EE;color:#1a1a1a;font-family:Hind,-apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
main{flex:1;width:100%;max-width:440px;margin:0 auto;padding:28px 20px 24px}
h1{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-0.02em}
.lead{margin:0 0 22px;color:#5c5c5c;font-size:15px;line-height:1.45}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
#pw{width:100%;font-size:16px;min-height:48px;padding:10px 12px;border:1px solid #cfc6b4;background:#fffdf8;border-radius:0;color:#1a1a1a}
#pw:focus{outline:2px solid #1a1a1a;outline-offset:1px}
.hint{margin:8px 0 0;font-size:12px;color:#8a8172}
.rows{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e6dfd1;padding:14px 14px;min-height:56px}
.mark{flex:none;width:28px;height:28px;display:grid;place-items:center;font-size:18px;font-weight:700;line-height:1}
.mark.idle{color:#cfc6b4}
.mark.ok{color:#2f7d4a}
.mark.bad{color:#a12a1b}
.mark.busy{color:#8a8172;font-size:14px}
.name{flex:1;font-size:15px;font-weight:600;line-height:1.3}
.status{font-size:12px;color:#8a8172;min-width:4.5em;text-align:right}
.status.ok{color:#2f7d4a}
.status.bad{color:#a12a1b}
#msg{min-height:20px;margin:14px 0 0;font-size:13px;color:#5c5c5c}
footer{text-align:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font-size:13px;color:#737373}
.foot{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.share{appearance:none;border:1px solid #cfc6b4;background:#fff;color:#1a1a1a;font:inherit;font-size:13px;font-weight:600;padding:8px 14px;min-height:40px;cursor:pointer;border-radius:0}
.share:active{background:#f3eee4}
.built{color:#737373;text-decoration:none}
.built:hover{color:#1a1a1a}
@media (min-width:700px){
  main{max-width:480px;padding-top:48px}
  h1{font-size:30px}
  .row{padding:16px 18px}
}
</style>
</head>
<body>
<main>
  <h1>Password Tester</h1>
  <p class="lead">Type a password. Each row turns green if it matches that site password, or red if not.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" autofocus>
  <p class="hint">Nothing you type is stored, logged, or sent anywhere.</p>
  <ul class="rows" id="rows" aria-live="polite"></ul>
  <p id="msg" role="status"></p>
</main>
<footer>
  <div class="foot">
    <button type="button" class="share" id="share">Share</button>
    <a class="built" href="https://maxweberman.com">Built by Machan</a>
  </div>
</footer>
<script>
(() => {
  const BLOBS = {"main":{"s":"SdjAwvjlDFKCgpWacrNHJg==","i":"/Lm7PkYGqQxxBqz6","c":"aVm0MzOCFSAVFldqbF26TW8w","n":600000},"upkeep":{"s":"W8kXrFq+o5L7Lou6DkN08Q==","i":"cUXivt+eTrARpuj9","c":"yiqoRJ0mk8DuNRSCsuP6od94","n":600000}};
  const ROWS = [
    { id: 'main', label: 'Main dashboard password', kind: 'ok-blob', blob: BLOBS.main },
    { id: 'upkeep', label: 'UpKeep share password', kind: 'ok-blob', blob: BLOBS.upkeep },
  ];

  const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  const rowsEl = document.getElementById('rows');
  const pwEl = document.getElementById('pw');
  const msgEl = document.getElementById('msg');
  const state = {};

  for (const r of ROWS) {
    const li = document.createElement('li');
    li.className = 'row';
    li.id = 'row-' + r.id;
    li.innerHTML = '<span class="mark idle" aria-hidden="true">·</span>' +
      '<span class="name"></span><span class="status">—</span>';
    li.querySelector('.name').textContent = r.label;
    rowsEl.appendChild(li);
    state[r.id] = { el: li, mark: li.querySelector('.mark'), status: li.querySelector('.status'), meta: r };
  }

  function setRow(id, mode, text) {
    const s = state[id];
    s.mark.className = 'mark ' + mode;
    s.mark.textContent = mode === 'ok' ? '✓' : mode === 'bad' ? '✕' : mode === 'busy' ? '…' : '·';
    s.status.className = 'status' + (mode === 'ok' || mode === 'bad' ? ' ' + mode : '');
    s.status.textContent = text;
  }

  function candidates(raw) {
    const v0 = String(raw || '').normalize('NFC');
    const v1 = v0.trim();
    const v2 = v1 ? v1.charAt(0).toLowerCase() + v1.slice(1) : v1;
    return [...new Set([v0, v1, v2].filter(x => x.length > 0))];
  }

  async function derive(pw, saltB64, n) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: u(saltB64), iterations: n, hash: 'SHA-256' }, base, 256));
  }

  async function tryDecryptOk(pw, D) {
    const keyRaw = await derive(pw, D.s, D.n);
    const key = await crypto.subtle.importKey('raw', keyRaw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(D.i) }, key, u(D.c));
    return dec.decode(pt) === 'OK';
  }

  let seq = 0;
  let timer = null;

  async function run() {
    const my = ++seq;
    const raw = pwEl.value;
    const cs = candidates(raw);
    if (!cs.length) {
      for (const r of ROWS) setRow(r.id, 'idle', '—');
      msgEl.textContent = '';
      return;
    }
    for (const r of ROWS) setRow(r.id, 'busy', 'Checking…');
    msgEl.textContent = 'Checking…';

    for (const r of ROWS) {
      if (my !== seq) return;
      let ok = false;
      try {
        if (r.kind === 'ok-blob') {
          for (const pv of cs) {
            try { if (await tryDecryptOk(pv, r.blob)) { ok = true; break; } } catch (_) {}
          }
        }
      } catch (e) {
        if (my !== seq) return;
        setRow(r.id, 'bad', 'Error');
        continue;
      }
      if (my !== seq) return;
      setRow(r.id, ok ? 'ok' : 'bad', ok ? 'Match' : 'No match');
    }
    if (my === seq) msgEl.textContent = '';
  }

  pwEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(run, 280);
  });
  pwEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); run(); }
  });

  document.getElementById('share').addEventListener('click', () => {
    const url = location.href.split('#')[0];
    const title = document.title;
    const btn = document.getElementById('share');
    if (navigator.share) {
      navigator.share({ title, url }).catch(() => {});
      return;
    }
    const done = () => { btn.textContent = 'Link copied'; setTimeout(() => { btn.textContent = 'Share'; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => {
        prompt('Copy this link:', url);
      });
    } else {
      prompt('Copy this link:', url);
    }
  });
})();
</script>
</body>
</html>
